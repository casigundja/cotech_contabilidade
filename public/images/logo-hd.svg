<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background circle with smooth edge and solid white fill -->
  <circle cx="256" cy="256" r="236" fill="#ffffff" stroke="#162238" stroke-width="20" filter="url(#crispShadow)"/>
  
  <!-- Red accent bar above CO -->
  <rect x="122" y="145" width="135" height="30" rx="12" fill="#e51e2b"/>
  
  <!-- COTECH bold typography -->
  <text x="256" y="286" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="104" 
        font-weight="900" 
        letter-spacing="2px" 
        fill="#162238" 
        text-anchor="middle">COTECH</text>
  
  <!-- Subtitle -->
  <text x="256" y="352" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="2px" 
        fill="#475569" 
        text-anchor="middle">O futuro em suas mãos</text>
  
  <!-- Cyan dot accent -->
  <circle cx="256" cy="405" r="9" fill="#00e5db"/>
</svg>