<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#1b2a40"/>
    </linearGradient>
  </defs>
  <!-- Outer Badge Circle -->
  <circle cx="200" cy="200" r="190" fill="#ffffff" stroke="url(#ringGrad)" stroke-width="14" filter="url(#badgeShadow)"/>
  
  <!-- Red accent bar over CO -->
  <rect x="95" y="115" width="105" height="24" rx="10" fill="#e51e2b"/>
  
  <!-- COTECH text -->
  <text x="200" y="228" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="82" 
        font-weight="900" 
        letter-spacing="2px" 
        fill="#162238" 
        text-anchor="middle">COTECH</text>
  
  <!-- Subtitle -->
  <text x="200" y="278" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="22" 
        font-weight="700" 
        letter-spacing="1.5px" 
        fill="#4a5568" 
        text-anchor="middle">O FUTURO EM SUAS MÃOS</text>
</svg>